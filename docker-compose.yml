version: '3.8'

services:
  retention-doctor:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./retention_doctor.db
    volumes:
      - retention_data:/app/backend/storage
    restart: unless-stopped

volumes:
  retention_data:
